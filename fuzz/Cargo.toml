[package]
name = "wiserone-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
wiserone = { path = ".." }

# Keep the fuzz crate out of any parent workspace.
[workspace]
members = ["."]

[[bin]]
name = "parse_corpus"
path = "fuzz_targets/parse_corpus.rs"
test = false
doc = false
bench = false
