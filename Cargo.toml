[package]
authors = ["Wiserone Contributors <contact@wiserone.com>"]
build = "build.rs"
categories = ["development-tools", "command-line-utilities", "template-engine"]
description = "Daily nuggets of wisdom in a clean, minimalist design, inspiring deeper thought and personal growth with every visit."
documentation = "https://lib.rs/crates/wiserone"
edition = "2021"
exclude = [
    "/.git/*",
    "/.github/*",
    "/.gitignore",
    "/.vscode/*"
    ]
homepage = "https://wiserone.com"
keywords = ['Wisdom', 'Quotes','Inspiration', 'Insights', 'Reflection']
license = "MIT OR Apache-2.0"
name = "wiserone"
readme = "README.md"
repository = "https://github.com/sebastienrousseau/wiserone"
rust-version = "1.75.0"
version = "0.0.6"
include = [
    "/benches/**",
    "/build.rs",
    "/Cargo.toml",
    "/CONTRIBUTING.md",
    "/examples/**",
    "/LICENSE-APACHE",
    "/LICENSE-MIT",
    "/README.md",
    "/src/**",
    "/tests/**"
]

[[bench]]
name = "benchmark"
harness = false
path = "benches/criterion.rs"

[profile.bench]
debug = true

[dependencies]
clap = { version = "4.6.4", features = ["env", "derive"] }
csv = "1.3.0"
dtt = "0.0.11"
env_logger = "0.11.5"
figlet-rs = "1.0.0"
serde = { version = "1.0.209", features = ["derive"] }
serde_json = "1.0.151"
vrd = "0.0.12"
rlg = "0.0.3"
uuid = { version = "1.10.0", features = ["serde", "v4"] }

# Ecosystem shared utilities
commons = { git = "https://github.com/sebastienrousseau/commons", branch = "feat/v0.0.1", default-features = false, features = ["time", "id", "env", "validation"] }

[dev-dependencies]
criterion = "0.8.2"
mockall = "0.15.0"
tempfile = "3.14.0"

[lib]
crate-type = ["lib"]
name = "wiserone"
path = "src/lib.rs"

[features]
default = []

[package.metadata.docs.rs]
all-features = true

# Linting config
[lints.rust]
missing_copy_implementations = "warn"
missing_docs = "warn"
unstable_features = "warn"
unused_extern_crates = "warn"
unused_results = "warn"

bare_trait_objects = "allow"
elided_lifetimes_in_paths = "allow"
non_camel_case_types = "allow"
non_upper_case_globals = "allow"
trivial_bounds = "allow"
unsafe_code = "allow"

missing_debug_implementations = "forbid"
non_ascii_idents = "forbid"
unreachable_pub = "forbid"

dead_code = "deny"
deprecated_in_future = "deny"
ellipsis_inclusive_range_patterns = "deny"
explicit_outlives_requirements = "deny"
future_incompatible = { level = "deny", priority = -1 }
keyword_idents = { level = "deny", priority = -1 }
macro_use_extern_crate = "deny"
meta_variable_misuse = "deny"
missing_fragment_specifier = "deny"
noop_method_call = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
rust_2021_compatibility = { level = "deny", priority = -1 }
single_use_lifetimes = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unused = { level = "deny", priority = -1 }
unused_features = "deny"
unused_import_braces = "deny"
unused_labels = "deny"
unused_lifetimes = "deny"
unused_macro_rules = "deny"
unused_qualifications = "deny"
variant_size_differences = "deny"

[package.metadata.clippy]
warn-lints = [
    "clippy::all",
    "clippy::pedantic",
    "clippy::cargo",
    "clippy::nursery",
]

[profile.dev]
codegen-units = 256
debug = true
debug-assertions = true
incremental = true
lto = false
opt-level = 0
overflow-checks = true
panic = 'unwind'
rpath = false
strip = false

[profile.release]
codegen-units = 1
debug = false
debug-assertions = false
incremental = false
lto = true
opt-level = "s"
overflow-checks = false
panic = "abort"
rpath = false
strip = "symbols"

[profile.test]
codegen-units = 256
debug = true
debug-assertions = true
incremental = true
lto = false
opt-level = 0
overflow-checks = true
rpath = false
strip = false

[lints.rust]
# src/lib.rs carries `#![cfg_attr(feature = "bench", feature(test))]` for
# nightly benchmarking. `bench` is deliberately NOT a real [features]
# entry: declaring it would make --all-features turn it on, and
# `feature(test)` is nightly-only (E0554 on the stable channel CI uses).
# Declaring the cfg here instead tells rustc the value is expected, so
# unexpected_cfgs stays quiet under -D warnings.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("bench"))'] }
