name: 🧪 Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  release:
    types: [created]

# Read-only by default; a job that writes declares exactly what it needs.
permissions:
  contents: read

jobs:
  all:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
          components: clippy
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check lints
        run: cargo check --all-targets --workspace --all-features
