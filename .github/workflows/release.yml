name: 🧪 Release

# Releases are cut by pushing a version tag. This workflow used to run on
# every push and pull request, which meant 20 cross-compiles and a
# crates.io publish attempt per commit on main -- the publish necessarily
# failing once that version was already uploaded.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  # Manual runs are a smoke test by default: guard + build only. Creating
  # the release and publishing to crates.io needs an explicit opt-in, so a
  # dispatch cannot accidentally cut a real release.
  workflow_dispatch:
    inputs:
      publish:
        description: "Create the GitHub release and publish to crates.io"
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Resolve the version once and decide whether crates.io already has it,
  # so a re-run of an existing tag is a no-op instead of a hard failure.
  guard:
    name: ❯ Verify 🔍
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      published: ${{ steps.resolve.outputs.published }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Resolve version and publication state
        id: resolve
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "wiserone") | .version')
          echo "Cargo.toml version: ${version}"

          # On a tag push the tag is authoritative; refuse to release when
          # it disagrees with the manifest.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "${tag}" != "${version}" ]; then
              echo "::error::tag v${tag} does not match Cargo.toml version ${version}"
              exit 1
            fi
          fi

          # crates.io returns 404 for a version that was never uploaded.
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H 'User-Agent: wiserone-release (github.com/sebastienrousseau/wiserone)' \
            "https://crates.io/api/v1/crates/wiserone/${version}")
          if [ "${code}" = "200" ]; then
            published=true
          elif [ "${code}" = "404" ]; then
            published=false
          else
            echo "::error::unexpected crates.io status ${code} for wiserone ${version}"
            exit 1
          fi
          echo "already on crates.io: ${published}"

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "published=${published}" >> "$GITHUB_OUTPUT"

  # Build the project for all the targets and generate artifacts.
  build:
    # This job builds the project for all the targets and generates a
    # release artifact that contains the binaries for all the targets.
    name: ❯ Build 🛠

    needs: guard

    # Set up the job environment variables.
    env:
      BUILD_ID: ${{ github.run_id }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OS: ${{ matrix.os }}
      TARGET: ${{ matrix.target }}

    strategy:
      fail-fast: false
      matrix:
        target:
          # List of targets:
          # https://doc.rust-lang.org/nightly/rustc/platform-support.html

          # Tier 1 platforms 🏆
          - aarch64-unknown-linux-gnu # 64-bit Linux systems on ARM architecture
          - i686-pc-windows-gnu # 32-bit Windows (i686-pc-windows-gnu)
          - i686-pc-windows-msvc # 32-bit Windows (i686-pc-windows-msvc)
          - i686-unknown-linux-gnu # 32-bit Linux (kernel 3.2+, glibc 2.17+)
          - x86_64-apple-darwin # 64-bit macOS (10.7 Lion or later)
          - x86_64-pc-windows-gnu # 64-bit Windows (x86_64-pc-windows-gnu)
          - x86_64-pc-windows-msvc # 64-bit Windows (x86_64-pc-windows-msvc)
          - x86_64-unknown-linux-gnu # 64-bit Linux (kernel 2.6.32+, glibc 2.11+)

          # Tier 2 platforms 🥈
          - aarch64-apple-darwin # 64-bit macOS on Apple Silicon
          - aarch64-pc-windows-msvc # 64-bit Windows (aarch64-pc-windows-msvc)
          - aarch64-unknown-linux-musl # 64-bit Linux systems on ARM architecture
          - arm-unknown-linux-gnueabi # ARMv6 Linux (kernel 3.2, glibc 2.17)
          - arm-unknown-linux-gnueabihf # ARMv7 Linux, hardfloat (kernel 3.2, glibc 2.17)
          - armv7-unknown-linux-gnueabihf # ARMv7 Linux, hardfloat (kernel 3.2, glibc 2.17)
          - powerpc-unknown-linux-gnu # PowerPC Linux (kernel 3.2, glibc 2.17)
          - powerpc64-unknown-linux-gnu # PowerPC64 Linux (kernel 3.2, glibc 2.17)
          - powerpc64le-unknown-linux-gnu # PowerPC64le Linux (kernel 3.2, glibc 2.17)
          # - riscv64gc-unknown-linux-gnu # RISC-V Linux (kernel 3.2, glibc 2.17)
          - s390x-unknown-linux-gnu # s390x Linux (kernel 3.2, glibc 2.17)
          - x86_64-unknown-freebsd # 64-bit FreeBSD on x86-64
          - x86_64-unknown-linux-musl # 64-bit Linux (kernel 2.6.32+, musl libc)
          # - x86_64-unknown-netbsd # 64-bit NetBSD on x86-64

        include:
          # Tier 1 platforms 🏆
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
          - target: i686-pc-windows-gnu
            os: ubuntu-latest
            cross: true
          - target: i686-pc-windows-msvc
            os: windows-latest
            cross: true
          - target: i686-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            cross: true
          - target: x86_64-pc-windows-gnu
            os: ubuntu-latest
            cross: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            cross: true
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true

          # Tier 2 platforms 🥈
          - target: aarch64-apple-darwin
            os: macos-latest
            cross: true
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: arm-unknown-linux-gnueabi
            os: ubuntu-latest
            cross: true
          - target: arm-unknown-linux-gnueabihf
            os: ubuntu-latest
            cross: true
          - target: armv7-unknown-linux-gnueabihf
            os: ubuntu-latest
            cross: true
          - target: powerpc-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
          - target: powerpc64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
          - target: powerpc64le-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
          # - target: riscv64gc-unknown-linux-gnu
          #   os: ubuntu-latest
          #   cross: true
          - target: s390x-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
          - target: x86_64-unknown-freebsd
            os: ubuntu-latest
            cross: true
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          # - target: x86_64-unknown-netbsd
          #   os: ubuntu-latest
          #   cross: true

    runs-on: ${{ matrix.os }}

    steps:
      # Check out the repository code.
      - name: Checkout sources
        id: checkout
        uses: actions/checkout@v7

      # Install the stable Rust toolchain. actions-rs/toolchain is archived
      # and its runner is too old for current GitHub Actions; the rest of
      # this repository already uses dtolnay/rust-toolchain.
      - name: Install stable toolchain
        id: install-toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Cache dependencies to speed up subsequent builds.
      - name: Cache dependencies
        id: cache-dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cargo
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install cross
        run: cargo install cross --locked
        shell: bash

      # Same invocation actions-rs/cargo@v1 made with use-cross: true, minus
      # the archived wrapper. cross falls back to cargo when the target
      # needs no container.
      - name: Build targets
        id: build-targets
        run: cross build --verbose --workspace --release --target "$TARGET"
        shell: bash

      # Package the binary for each target
      - name: Package the binary
        id: package-binary
        run: |
          mkdir -p target/package
          tar czf "target/package/${TARGET}.tar.gz" -C "target/${TARGET}/release" .
          echo "${TARGET}.tar.gz=target/package/${TARGET}.tar.gz" >> "$GITHUB_ENV"

      # Upload the binary for each target
      - name: Upload the binary
        id: upload-binary
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.TARGET }}.tar.gz
          path: target/package/${{ env.TARGET }}.tar.gz

  # Publish the GitHub release with every built artifact attached.
  release:
    name: ❯ Release 🚀
    needs: [guard, build]
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      # Pull down every artifact the build matrix uploaded. merge-multiple
      # flattens them into one directory instead of one folder per artifact.
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum ./*.tar.gz > SHA256SUMS
          cat SHA256SUMS

      # gh is preinstalled on the runner, so this replaces the archived
      # actions/create-release@v1 without adding a third-party dependency.
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          gh release create "v${VERSION}" \
            --title "The Wiser One 🦀 v${VERSION}" \
            --generate-notes \
            --draft \
            dist/*.tar.gz dist/SHA256SUMS

  # Publish to crates.io, but only when this version is not already there.
  crate:
    name: ❯ Crate.io 🦀
    needs: [guard, release]
    if: |
      (github.event_name == 'push' || inputs.publish)
      && needs.guard.outputs.published == 'false'
    runs-on: ubuntu-latest
    permissions:
      # Lets the job mint the OIDC identity token that crates.io exchanges
      # for a short-lived publish token. Without this the auth step fails.
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      # Trusted publishing: exchanges this job's GitHub OIDC identity for a
      # temporary crates.io token, scoped to this crate and revoked by the
      # action's post step when the job ends. No stored secret, so nothing
      # to rotate and nothing to leak.
      #
      # This requires a matching trusted publisher on crates.io for the
      # wiserone crate: repository sebastienrousseau/wiserone, workflow
      # release.yml. If that is absent the step fails with "no matching
      # trusted publishing config".
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      # No --no-verify: the packaged crate is built before upload, so a
      # release that cannot compile from its own tarball fails here rather
      # than after it is public and immutable.
      - name: Publish library to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked
