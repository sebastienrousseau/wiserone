name: 🧪 Test

on: [pull_request, push]
jobs:
  test-lib:
    name: Test library
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [ubuntu-latest]
        toolchain: [stable, nightly]
    continue-on-error: true

    steps:
      # Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v7

      # Setup Rust
      - name: Setup Rust
        run: |
          rustup toolchain add ${{ matrix.toolchain }} --component llvm-tools-preview
          rustup override set ${{ matrix.toolchain }}

      # Configure cache
      - name: Configure cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: test-${{ runner.os }}-cargo-${{ matrix.toolchain }}-${{ hashFiles('**/Cargo.lock') }}

      # Run tests with all features
      - name: Run tests with all features
        id: run-tests-all-features
        run: cargo test --verbose --workspace --all-features

      # The corpus is duplicated across this crate, the Swift app and
      # the website. Structural checks live in tests/test_corpus.rs;
      # this is the one thing a test cannot do — confirm the shipped
      # corpus still matches what wiserone.com publishes.
      - name: Verify corpus against wiserone.com
        run: ./scripts/verify-corpus.sh

