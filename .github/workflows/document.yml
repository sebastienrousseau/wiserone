name: 🧪 Document

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  release:
    types: [created]
  workflow_dispatch:

# Only one Pages deploy at a time.
concurrency:
  group: pages
  cancel-in-progress: false

# Read-only by default; a job that writes declares exactly what it needs.
permissions:
  contents: read

jobs:
  all:
    name: Document
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate documentation for all features
        run: |
          RUSTDOCFLAGS="--cfg docsrs" \
            cargo doc --no-deps --all-features --workspace
          echo '<html><head><meta http-equiv="refresh" content="0; url=/wiserone/"></head><body></body></html>' > ./target/doc/index.html
          touch ./target/doc/.nojekyll
          echo "docs.wiserone.com" > ./target/doc/CNAME

      # rustdoc pages carry no canonical and its search box makes
      # endless `?search=` URLs, which Search Console filed as
      # duplicates. Add canonicals, robots.txt and a sitemap of the
      # current item pages, then prove the artefact has all three.
      - name: Add canonicals, robots.txt and sitemap
        run: |
          python3 scripts/docs_seo.py target/doc https://docs.wiserone.com
          python3 scripts/docs_seo.py --check target/doc https://docs.wiserone.com

      - name: Upload documentation artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: documentation
          path: target/doc
          if-no-files-found: error
          retention-days: 1

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: target/doc
          include-hidden-files: true

  deploy:
    name: Deploy Pages
    needs: all
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

