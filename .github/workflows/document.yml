name: 🧪 Document

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  release:
    types: [created]

jobs:
  all:
    name: Document
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
    steps:
      - uses: hecrj/setup-rust-action@v2
        with:
          rust-version: nightly

      - uses: actions/checkout@v7

      - name: Generate documentation for all features and publish it
        run: |
          RUSTDOCFLAGS="--cfg docsrs" \
            cargo doc --no-deps --all-features --workspace
            # Write index.html with redirect
            echo '<html><head><meta http-equiv="refresh" content="0; url=/wiserone/"></head><body></body></html>' > ./target/doc/index.html

      - name: Deploy
        uses: actions/upload-artifact@v7
        with:
          name: documentation
          path: target/doc
          if-no-files-found: error
          retention-days: 1

      - name: Write CNAME file
        run: echo 'docs.wiserone.com' > ./target/doc/CNAME

      # Publishes on every push to main. This guard was added when
      # wiserone.com was this repository's Pages domain and a stray
      # deploy could have taken the live site down. The domain is now
      # docs.wiserone.com and the site itself lives in
      # sebastienrousseau/wiserone.github.io, so publishing rustdoc here
      # on push is exactly what is wanted.
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./target/doc
          publish_branch: gh-pages
          cname: true
          clean: true
          commit_message: Deploy documentation at ${{ github.sha }}
          commit_user_name: github-actions
          commit_user_email: actions@users.noreply.github.com
