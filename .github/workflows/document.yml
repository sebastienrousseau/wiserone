name: 🧪 Document

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  release:
    types: [created]

# Read-only by default; a job that writes declares exactly what it needs.
permissions:
  contents: read

jobs:
  all:
    name: Document
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push rustdoc to the gh-pages branch
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
    steps:
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: nightly

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate documentation for all features and publish it
        run: |
          RUSTDOCFLAGS="--cfg docsrs" \
            cargo doc --no-deps --all-features --workspace
            # Write index.html with redirect
            echo '<html><head><meta http-equiv="refresh" content="0; url=/wiserone/"></head><body></body></html>' > ./target/doc/index.html

      - name: Deploy
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: documentation
          path: target/doc
          if-no-files-found: error
          retention-days: 1

      # Publishes on every push to main. This guard was added when
      # wiserone.com was this repository's Pages domain and a stray
      # deploy could have taken the live site down. The domain is now
      # docs.wiserone.com and the site itself lives in
      # sebastienrousseau/wiserone.github.io, so publishing rustdoc here
      # on push is exactly what is wanted.
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./target/doc
          publish_branch: gh-pages
          # Writes the CNAME file; keep_files defaults to false, so every
          # deploy replaces the branch contents.
          cname: docs.wiserone.com
          commit_message: Deploy documentation at ${{ github.sha }}
          user_name: github-actions
          user_email: actions@users.noreply.github.com

  # Deploys the gh-pages branch just published, with GitHub Actions
  # (see pages.yml).
  pages:
    name: Deploy Pages
    needs: all
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
