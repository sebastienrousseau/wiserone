# cargo-deny configuration.
#
# Rewritten for the current schema. The previous file could not be
# deserialized at all, so `cargo deny check` failed before running a
# single lint:
#
#   * `copyleft`, `allow-osi-fsf-free` and `confidence-threshold` sat
#     after the `[bans]` header, so they were parsed as bans keys. They
#     were meant for `[licenses]`; the first two no longer exist in any
#     section — the `allow` list below is the explicit replacement.
#   * `[licenses] unlicensed` was removed upstream: a crate whose
#     license is not in `allow` is denied regardless.
#   * `[advisories]` no longer takes per-severity levels
#     (`notice`/`unsound`/`vulnerability`). Vulnerabilities always fail,
#     and `unmaintained` now takes a scope rather than a lint level.

[licenses]
# Any license not listed here is denied.
allow = [
    "Apache-2.0",
    "MIT",
    "CC0-1.0",
    "ISC",
    "0BSD",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unlicense",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    # `foldhash`, reached transitively through
    # rlg -> config -> yaml-rust2 -> hashlink -> hashbrown.
    # Zlib is permissive, OSI-approved and FSF Free/Libre.
    "Zlib",
]
# How closely detected license text must match the canonical SPDX text.
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
highlight = "all"
allow = []
deny = []
skip = []
skip-tree = []

[advisories]
# Scope for unmaintained-crate advisories. "all" includes transitive
# dependencies, which is where they nearly always appear.
unmaintained = "all"
yanked = "deny"
