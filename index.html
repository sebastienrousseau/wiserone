  <script>
    document.addEventListener("DOMContentLoaded", function () {
      var toggle = document.getElementById("themeToggle");
      if (toggle) {
        toggle.addEventListener("click", function () {
          var root = document.documentElement;
          var current = root.getAttribute("data-theme");
          if (!current) {
            current = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          var next = current === "dark" ? "light" : "dark";
          root.setAttribute("data-theme", next);
          try { localStorage.setItem("wiserone-theme", next); } catch (e) { /* ignore */ }
        });
      }

      var copyBtn = document.getElementById("copyQuoteBtn");
      var copyLabel = document.getElementById("copyLabel");
      if (copyBtn) {
        copyBtn.addEventListener("click", function () {
          if (!navigator.clipboard) return;
          var text = "\u201C" + copyBtn.getAttribute("data-quote") + "\u201D \u2014 " +
            copyBtn.getAttribute("data-author") + " (" + copyBtn.getAttribute("data-url") + ")";
          navigator.clipboard.writeText(text).then(function () {
            if (copyLabel) {
              copyLabel.textContent = "Copied \u2713";
              setTimeout(function () { copyLabel.textContent = "Copy quote"; }, 1800);
            }
          });
        });
      }
    });
